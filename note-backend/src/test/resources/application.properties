# Test configuration.
#
# Test resources shadow src/main/resources on the test classpath, so this file fully replaces
# the production one — the suite never touches MySQL and needs no running database.
#
# H2 runs in MySQL compatibility mode, and Hibernate builds the schema from the entity
# mapping (create-drop) rather than from db/schema.sql, because that file uses MySQL-specific
# DDL that H2 will not parse. That is the fidelity gap of this choice: these tests verify the
# queries and the adapter, not the production DDL. Booting the app against real MySQL with
# ddl-auto=validate is what verifies db/schema.sql.
spring.datasource.url=jdbc:h2:mem:simple_note;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=false
