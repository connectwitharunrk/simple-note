spring.application.name=note-backend

# --- Datasource -------------------------------------------------------------------------
# Every value is an environment variable with a development default, so nothing secret is
# committed and no credential is hardcoded in Kotlin. Override DB_USERNAME / DB_PASSWORD in
# your environment (or with --spring.datasource.password=...) for anything but local XAMPP.
#
# connectionTimeZone=UTC keeps the JDBC driver from reinterpreting timestamps in the server's
# local zone, which is the usual cause of notes appearing hours off.
#
# The default targets XAMPP, which ships MariaDB even though its control panel says "MySQL".
# For a real MySQL 8 server, override with the Connector/J URL instead:
#   DB_URL=jdbc:mysql://localhost:3306/simple_note?connectionTimeZone=UTC&characterEncoding=utf8
# Both drivers are on the classpath, so only this one value has to change.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/simple_note?connectionTimeZone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate --------------------------------------------------------------------
# validate, never update: the schema is owned by db/schema.sql and applied through phpMyAdmin.
# If the entity and the table disagree, the application refuses to start instead of silently
# altering your data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Lazy loading must not depend on an open view; the REST layer works with DTOs only.
spring.jpa.open-in-view=false

# --- Web --------------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
# This project emits its own ErrorResponse envelope from @RestControllerAdvice, so Spring's
# RFC 7807 ProblemDetail bodies stay off — one error shape on the wire, not two.
spring.mvc.problemdetails.enabled=false
# Let the advice handle unmapped paths as a normal 404 instead of forwarding to /error.
spring.web.resources.add-mappings=false
